<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Registration Form</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 620px; margin: 35px auto; padding: 24px; background: #f4f6f8; }
    main { background: white; padding: 26px; border-radius: 10px; box-shadow: 0 2px 12px #0001; }
    h1 { margin-top: 0; }
    label { display: block; margin-top: 15px; font-weight: 600; }
    input, select { box-sizing: border-box; width: 100%; padding: 10px; margin-top: 6px; border: 1px solid #bbb; border-radius: 5px; }
    button { margin-top: 22px; padding: 11px 18px; border: 0; border-radius: 5px; background: #175cd3; color: white; cursor: pointer; }
    #result { margin-top: 20px; padding: 12px; border-radius: 5px; background: #e7f8ec; color: #14532d; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <h1>Student Registration</h1>
    <form id="registrationForm">
      <label for="studentName">Student Name</label>
      <input id="studentName" name="studentName" type="text" required>

      <label for="rollNumber">Roll Number</label>
      <input id="rollNumber" name="rollNumber" type="text" required>

      <label for="email">Email Address</label>
      <input id="email" name="email" type="email" required>

      <label for="mobile">Mobile Number</label>
      <input id="mobile" name="mobile" type="tel" pattern="[0-9]{10}" title="Enter a 10-digit mobile number" required>

      <label for="department">Department</label>
      <select id="department" name="department" required>
        <option value="">-- Select Department --</option>
        <option value="Computer Science">Computer Science</option>
        <option value="Information Technology">Information Technology</option>
        <option value="Artificial Intelligence">Artificial Intelligence</option>
        <option value="Electronics">Electronics</option>
        <option value="Mechanical">Mechanical</option>
      </select>

      <button id="submitButton" type="submit">Submit Registration</button>
    </form>
    <p id="result" role="status" hidden></p>
  </main>

  <script>
    const form = document.getElementById("registrationForm");
    const result = document.getElementById("result");

    form.addEventListener("submit", function (event) {
      event.preventDefault();
      result.textContent = "Registration submitted successfully for " +
        document.getElementById("studentName").value.trim() + "!";
      result.hidden = false;
    });
  </script>
</body>
</html>
